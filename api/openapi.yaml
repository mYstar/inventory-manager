openapi: 3.1.0
info:
  title: Inventory Manager
  description:
    Inventory Manager that stores items, manipulates their quantities, and calculates the value of inventory items.
  version: 1.0.0
paths:
  /items:
    get:
      description: Returns all items in inventory.
      responses:
        '200':
          description: Returns the items in the inventory as a JSON array of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items'
        '500':
          description: An unexpected server error occurred.
  /item:
    post:
      description: Adds the specified item to inventory.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        '201':
          description: The item was added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: The given data was invalid.
        '500':
          description: An unexpected server error occurred.
  
components:
  schemas:
    Items:
      type: array
      items:
        $ref: '#/components/schemas/Item'
    Item:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: The unique identifier of the inventory item.
        name:
          type: string
          example: 'Table'
          description:
            The name of the inventory item.
        quantity:
          type: integer
          format: int64
          example: 10
          description: The current quantity of the inventory item.
        price:
          type: number
          format: double
          example: 119.99
          description: The monetary value of the inventory item in euro.

    ItemCreate:
      type: object
      properties:
        name:
          type: string
          example: 'Chair'
          description:
            The name of the inventory item to create.
        quantity:
          type: integer
          format: int64
          example: 3
          description: The current quantity of the inventory item to create.
        price:
          type: number
          format: double
          example: 29.99
          description: The monetary value of the inventory item to create in euro.